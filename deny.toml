# cargo-deny configuration — runs in every CI job
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
]

# ── Advisories ────────────────────────────────────────────────────────────────
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # paste is unmaintained; transitive dep via lofty. No fix available without
    # lofty dropping its paste dependency upstream.
    # TODO: drop this ignore once lofty releases a build free of paste.
    { id = "RUSTSEC-2024-0436", reason = "transitive via lofty, no patched version available upstream" },
    # ttf-parser is unmaintained (informational advisory, not a memory-safety
    # CVE); transitive via iced's font stack. No safe upgrade until
    # iced/cosmic-text move off it upstream.
    # TODO: drop this ignore once the iced font stack no longer pulls ttf-parser.
    { id = "RUSTSEC-2026-0192", reason = "transitive via iced font dependencies, no patched version available upstream" },
    # quick-xml < 0.41 DoS via untrusted XML (quadratic attribute check /
    # unbounded namespace allocations). Sole consumer here is wayland-scanner,
    # a build-time proc-macro parsing the vendored Wayland protocol XML — no
    # untrusted XML is ever parsed at runtime. wayland-scanner 0.31.10 (latest)
    # still requires quick-xml ^0.39; drop both ignores when it moves to 0.41.
    { id = "RUSTSEC-2026-0194", reason = "build-time only: wayland-scanner proc-macro parses vendored protocol XML, never untrusted input; no upstream release requires the patched quick-xml 0.41 yet" },
    { id = "RUSTSEC-2026-0195", reason = "build-time only: wayland-scanner proc-macro parses vendored protocol XML, never untrusted input; no upstream release requires the patched quick-xml 0.41 yet" },
]

# ── Licenses ──────────────────────────────────────────────────────────────────
[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unlicense",
    "0BSD",
    "CC0-1.0",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
]
# OR-expression crates — cargo-deny picks the first allowed license:
#   self_cell:  Apache-2.0 OR GPL-2.0-only      → Apache-2.0
#   r-efi:      MIT OR Apache-2.0 OR LGPL-2.1   → MIT

# ── Bans ──────────────────────────────────────────────────────────────────────
[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

# ── Sources ───────────────────────────────────────────────────────────────────
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
